# Institution Resolver v3 - Docker Compose (Elasticsearch + Ollama + API & CLI)
# Kullanim:
#   docker compose up -d              # Servisleri baslat
#   docker compose logs -f api        # Loglari izle
#   docker compose exec api inres3 --help  # Container icinde CLI kullan
#   docker compose exec api pytest    # Testleri calistir

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      retries: 12

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - INRES3_CONFIG=/app/config/docker.yaml
      - PYTHONUNBUFFERED=1
    depends_on:
      elasticsearch:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      # Gelistirme & Hot-reload: kod degisiklikleri aninda container'a yansir
      - ./src:/app/src
      - ./config:/app/config
      - ./tests:/app/tests
      - ./data/processed:/app/data/processed
      - ./data/jobs:/app/data/jobs
      - ./data/inventory:/app/data/inventory
      - ./output:/app/output
      # Model cache volume: ~1.1GB embedding modeli container silinse de tekrar inmesin
      - hf_cache:/root/.cache/huggingface

volumes:
  esdata:
  ollama_data:
  hf_cache:
