<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Institution Resolver</title>
<style>
  :root {
    --bg: #f7f7f8; --card: #ffffff; --text: #1a1a1a; --muted: #666;
    --border: #ddd; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171a; --card: #222327; --text: #eee; --muted: #999; --border: #3a3b3f; }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    margin: 0; padding: 24px; max-width: 720px; margin-inline: auto;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; margin-bottom: 24px; font-size: .9rem; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px; margin-bottom: 20px;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=text], input[type=file] {
    flex: 1; min-width: 200px; padding: 10px 12px; font-size: 1rem;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);
  }
  button {
    padding: 10px 18px; font-size: 1rem; border: none; border-radius: 8px;
    background: var(--accent); color: white; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  select {
    padding: 10px 12px; font-size: 1rem; border: 1px solid var(--border);
    border-radius: 8px; background: var(--bg); color: var(--text);
  }
  .result { margin-top: 16px; }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .8rem;
    font-weight: 600; color: white;
  }
  .badge.auto_match { background: #16a34a; }
  .badge.review { background: #d97706; }
  .badge.ambiguous { background: #7c3aed; }
  .badge.no_match { background: #dc2626; }
  .field { margin-bottom: 10px; }
  .field .label { font-size: .8rem; color: var(--muted); }
  .field .value { font-size: 1.05rem; }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: .85rem; }
  pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; overflow-x: auto; font-size: .8rem;
  }
  .error { color: #dc2626; }
  .hint { color: var(--muted); font-size: .85rem; margin-top: 6px; }
  .candidates { margin-top: 6px; }
  .candidates .label { font-size: .8rem; color: var(--muted); }
  .candidates ul { margin: 4px 0 0; padding-left: 18px; }
  .candidates li { font-size: .95rem; margin-top: 2px; }
  .progress-bar {
    height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; margin-top: 8px;
  }
  .progress-bar > div { height: 100%; background: var(--accent); transition: width .3s; }
</style>
</head>
<body>

<h1>Institution Resolver</h1>
<p class="sub">Serbest metin kurum ifadesini kanonik kayda çözer.</p>

<div class="card">
  <h3 style="margin-top:0">Tek sorgu</h3>
  <div class="row">
    <input type="text" id="q" placeholder="örn. gazi üniversitesi istatistik bölümü" />
    <select id="mode">
      <option value="decide" selected>Hibrit (önerilen)</option>
      <option value="gate">Hızlı (LLM yok)</option>
      <option value="judge">Kesin (LLM zorunlu)</option>
    </select>
    <button id="qBtn" onclick="runQuery()">Sorgula</button>
  </div>
  <p class="hint" id="qHint"></p>
  <div class="result" id="qResult"></div>
</div>

<div class="card">
  <h3 style="margin-top:0">Toplu (CSV) sorgu</h3>
  <div class="row">
    <input type="file" id="csvFile" accept=".csv" />
    <input type="text" id="colName" value="raw_name" style="max-width:160px" placeholder="kolon adı" />
    <select id="batchMode">
      <option value="decide" selected>Hibrit (önerilen)</option>
      <option value="gate">Hızlı (LLM yok)</option>
      <option value="judge">Kesin (LLM zorunlu)</option>
    </select>
    <button id="batchBtn" onclick="runBatch()">Yükle ve İşle</button>
  </div>
  <p class="hint">CSV'de kurum ifadelerinin olduğu kolonun adını yazın (varsayılan: raw_name).</p>
  <div class="result" id="batchResult"></div>
</div>

<script>
function verdictBadge(v) {
  if (!v) return '';
  const labels = {auto_match: 'otomatik eşleşti', review: 'gözden geçirilmeli', ambiguous: 'belirsiz', no_match: 'eşleşme yok'};
  return `<span class="badge ${v}">${labels[v] || v}</span>`;
}

function renderError(detail, fallback) {
  // detail bazi endpoint'lerde duz string (ör. /batch/*), bazilarinda
  // {message, debug} nesnesi (ör. /judge, /decide - JudgeValidationError,
  // bkz. api/routers/single.py _error_detail). Ikisini de karsilar - nesneyi
  // dogrudan sablona gomersek "[object Object]" cikardi.
  if (detail && typeof detail === 'object') {
    const debugHtml = detail.debug
      ? `<details><summary>Ayrıntı</summary><pre>${detail.debug}</pre></details>`
      : '';
    return `<p class="error">Hata: ${detail.message || fallback}</p>${debugHtml}`;
  }
  return `<p class="error">Hata: ${detail || fallback}</p>`;
}

function renderCandidates(candidates) {
  // "Oneri" (2026-08-21 karari): SAF EKLENTI - mevcut isim/id gosterimine
  // DOKUNMAZ, yaninda ek olarak durur. YALNIZ kurum (parent) icin dolu
  // gelir; review/ambiguous + guclu exact varsa (bkz. gate.gate.py).
  if (!candidates || !candidates.length) return '';
  const items = candidates.map(c => {
    const parentSuffix = c.parent_name ? ` <span class="hint">(${c.parent_name})</span>` : '';
    return `<li>${c.name}${parentSuffix} <span class="hint">(id ${c.id})</span></li>`;
  }).join('');
  return `<div class="candidates"><div class="label">öneri</div><ul>${items}</ul></div>`;
}

function renderDecision(title, d) {
  if (!d) return `<div class="field"><div class="label">${title}</div><div class="value">(sorguda yok)</div></div>`;
  const parentSuffix = d.parent_name ? ` <span class="hint">(${d.parent_name})</span>` : '';
  return `
    <div class="field">
      <div class="label">${title} ${verdictBadge(d.verdict)}</div>
      <div class="value">${d.name || '—'}${parentSuffix} ${d.matched_id ? `<span class="hint">(id ${d.matched_id})</span>` : ''}</div>
      ${renderCandidates(d.candidates)}
    </div>`;
}

const MODE_HINTS = {
  decide: 'Hibrit: basit sorgular saniyeler içinde döner; gerekirse LLM devreye girer (~30-60sn sürebilir).',
  gate: 'Hızlı: LLM yok, deterministik kurallarla anında karar verir (belirsiz sorgularda "gözden geçirilmeli/belirsiz" döner).',
  judge: 'Kesin: her sorguda LLM hakem çalışır, ~30-60sn sürebilir.',
};

function updateQHint() {
  document.getElementById('qHint').textContent = MODE_HINTS[document.getElementById('mode').value];
}
updateQHint();
document.getElementById('mode').addEventListener('change', updateQHint);

async function runQuery() {
  const q = document.getElementById('q').value.trim();
  const mode = document.getElementById('mode').value;
  const btn = document.getElementById('qBtn');
  const out = document.getElementById('qResult');
  if (!q) return;
  btn.disabled = true;
  out.innerHTML = '<p class="hint">Çalışıyor…</p>';
  try {
    const res = await fetch('/' + mode, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query: q})
    });
    const body = await res.json();
    if (!res.ok) {
      out.innerHTML = renderError(body.detail, res.status);
      return;
    }
    out.innerHTML = `
      ${renderDecision('Kurum', body.parent)}
      ${renderDecision('Birim', body.subunit)}
      <details><summary>Katalog Kaydı — Kurum</summary><pre>${JSON.stringify(body.parent_record, null, 2)}</pre></details>
      <details><summary>Katalog Kaydı — Birim</summary><pre>${JSON.stringify(body.subunit_record, null, 2)}</pre></details>
      <details><summary>Ham JSON</summary><pre>${JSON.stringify(body, null, 2)}</pre></details>
    `;
  } catch (e) {
    out.innerHTML = `<p class="error">Bağlantı hatası: ${e}</p>`;
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('q').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') runQuery();
});

async function runBatch() {
  const file = document.getElementById('csvFile').files[0];
  const col = document.getElementById('colName').value.trim() || 'raw_name';
  const mode = document.getElementById('batchMode').value;
  const btn = document.getElementById('batchBtn');
  const out = document.getElementById('batchResult');
  if (!file) { out.innerHTML = '<p class="error">Önce bir CSV dosyası seçin.</p>'; return; }
  btn.disabled = true;
  out.innerHTML = '<p class="hint">Yükleniyor…</p>';
  try {
    const form = new FormData();
    form.append('file', file);
    form.append('query_col', col);
    const res = await fetch('/batch/' + mode, {method: 'POST', body: form});
    const body = await res.json();
    if (!res.ok) {
      out.innerHTML = renderError(body.detail, res.status);
      btn.disabled = false;
      return;
    }
    pollJob(body.job_id, out, btn);
  } catch (e) {
    out.innerHTML = `<p class="error">Bağlantı hatası: ${e}</p>`;
    btn.disabled = false;
  }
}

async function pollJob(jobId, out, btn) {
  const res = await fetch(`/jobs/${jobId}`);
  const s = await res.json();
  const pct = s.total > 0 ? Math.min(100, Math.round(((s.ok + s.error) / s.total) * 100)) : 0;
  if (s.status === 'done') {
    out.innerHTML = `
      <p>Bitti — ${s.ok} başarılı, ${s.error} hatalı (${s.total} satır).</p>
      <button class="secondary" onclick="window.location='/jobs/${jobId}/result'">Sonuç CSV'sini indir</button>
    `;
    btn.disabled = false;
  } else if (s.status === 'error') {
    out.innerHTML = `<p class="error">Job hata verdi: ${s.error_message || '—'}</p>`;
    btn.disabled = false;
  } else {
    out.innerHTML = `
      <p class="hint">İşleniyor… (${s.ok + s.error}/${s.total || '?'})</p>
      <div class="progress-bar"><div style="width:${pct}%"></div></div>
    `;
    setTimeout(() => pollJob(jobId, out, btn), 1500);
  }
}
</script>

</body>
</html>
