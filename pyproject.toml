[project]
name = "institution-resolver-v3"
version = "0.1.0"
description = "Serbest metin kurum ifadesini kanonik parent+subunit'e cozer: ES aday uretimi + LLM hakem karar katmani"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "typer>=0.12",
    "pyyaml>=6.0",
    "elasticsearch>=8.11,<9",
    "rapidfuzz>=3.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
embed = ["sentence-transformers>=2.7"]   # F3: kNN/embedding
llm = ["httpx>=0.27"]                    # F4: hakem - Ollama HTTP client (Anthropic bu katmanda KULLANILMIYOR, maliyet karari)

[project.scripts]
inres3 = "institution_resolver_v3.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: canli Elasticsearch gerektiren testler (docker compose up)",
    "llm: canli LLM API cagrisi gerektiren testler",
]
